case:
  name: wave_pulse_3d_explicit
  description: Report-only refined three-dimensional explicit longitudinal Gaussian pulse benchmark.
model:
  name: wave_pulse_3d_explicit
  dimension: 3
  geometry:
    type: box
    origin: [0.0, 0.0, 0.0]
    size: [1.0, 0.05, 0.05]
  mesh:
    generator: gmsh
    element_type: hex8
    divisions: [400, 1, 1]
  material:
    type: linear_elastic
    name: concrete_linear
    density: 2400.0
    young_modulus: 3.0e10
    poisson_ratio: 0.0
  quadrature:
    order: 2
  boundary_conditions:
    dirichlet: []
    velocity: []
    traction: []
    pressure: []
section:
  thickness: 1.0
analysis:
  type: wave
  plane_state: three_dimensional
  time:
    scheme: explicit_central_difference
    time_step: 1.25e-7
    num_steps: 1280
    beta: 0.0
    gamma: 0.5
    cfl_safety_factor: 0.8
  linear_solver:
    backend: scipy
    method: direct
  newton:
    max_iterations: 20
    residual_tolerance: 1.0e-10
    increment_tolerance: 1.0e-12
  surrogate:
    mode: disabled
    backend: none
wave:
  amplitude: 1.0e-7
  center: 0.2
  width: 0.06
  gauges: [0.5, 0.75]
output:
  root: results/benchmarks/codebase/wave_pulse_3d_explicit_report_refined
  mesh_path: results/benchmarks/codebase/wave_pulse_3d_explicit_report_refined/mesh.msh
  vtk_path: results/benchmarks/codebase/wave_pulse_3d_explicit_report_refined/mesh.vtu
  save_vtk: true
  save_history: true
  fields: [displacement, strain, stress]
verification:
  tolerance: 1.0e-2
