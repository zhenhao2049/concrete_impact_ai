case:
  name: elastic_tension_2d_displacement
  description: Two-dimensional plane-stress beam tension benchmark with right-end displacement control.
model:
  name: elastic_tension_2d_displacement
  dimension: 2
  geometry:
    type: rectangle
    origin: [0.0, 0.0]
    size: [1.0, 0.1]
  mesh:
    generator: gmsh
    element_type: quad4
    divisions: [20, 2]
  material:
    type: linear_elastic
    name: concrete_linear
    density: 2400.0
    young_modulus: 3.0e10
    poisson_ratio: 0.2
  quadrature:
    order: 2
  boundary_conditions:
    dirichlet: []
    velocity: []
    traction: []
    pressure: []
section:
  thickness: 0.02
analysis:
  type: elastic
  plane_state: plane_stress
  linear_solver:
    backend: scipy
    method: direct
  newton:
    max_iterations: 20
    residual_tolerance: 1.0e-10
    increment_tolerance: 1.0e-12
  surrogate:
    mode: disabled
    backend: none
loading:
  control: displacement
  right_displacement: 1.0e-5
  steps: 6
output:
  root: results/benchmarks/codebase/elastic_tension_2d_displacement
  mesh_path: results/benchmarks/codebase/elastic_tension_2d_displacement/mesh.msh
  vtk_path: results/benchmarks/codebase/elastic_tension_2d_displacement/mesh.vtu
  save_vtk: true
  save_history: true
  fields: [displacement, strain, stress]
verification:
  tolerance: 1.0e-3
