case:
  name: plastic_dp_cap_hydrostatic
  description: Drucker-Prager/Cap hydrostatic compression benchmark.
model:
  material:
    type: drucker_prager_cap
    name: concrete_dp_cap_hydrostatic_benchmark
    density: 2400.0
    young_modulus: 3.0e10
    poisson_ratio: 0.20
    friction_parameter: 0.5
    cohesion: 3.0e6
    flow_parameter: 0.0
    cohesion_hardening: 0.0
    kappa_rate: 1.0
    initial_cap_apex_pressure: 2.5e7
    cap_transition_ratio: 0.45
    cap_hardening: 5.0e9
    max_local_iterations: 30
    local_tolerance: 1.0e-10
analysis:
  time_step: 1.0
  material_update:
    max_iterations: 50
    yield_relative_tolerance: 1.0e-10
    residual_absolute_tolerance: 1.0e-12
    residual_relative_tolerance: 1.0e-10
benchmark:
  type: dp_cap_hydrostatic
  num_steps: 121
  max_compression_strain: 3.0e-3
  need_tangent: false
  x_name: compression_strain
  plot_pairs:
    - numerical: pressure_numerical
      exact: pressure_exact
    - numerical: cap_pressure_numerical
      exact: cap_pressure_exact
    - numerical: plastic_volumetric_strain_numerical
      exact: plastic_volumetric_strain_exact
verification:
  relative_tolerance: 1.0e-8
  absolute_tolerance: 1.0e-3
output:
  root: results/benchmarks/plasticity/plastic_dp_cap_hydrostatic
