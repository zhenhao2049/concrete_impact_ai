case:
  name: cylindrical_inclusion_rve
  description: Centered periodic elastic reinforcement in a J2-VP matrix.
rve:
  lengths: [1.0, 1.0, 1.0]
  inclusion_volume_fraction: 0.05
  circumferential_divisions: [16, 32, 64]
  matrix_radial_divisions: 2
  axial_divisions: 1
  material_update:
    max_iterations: 50
    yield_relative_tolerance: 1.0e-10
    residual_absolute_tolerance: 1.0e-12
    residual_relative_tolerance: 1.0e-10
  newton:
    max_iterations: 30
    residual_absolute_tolerance: 1.0e-10
    residual_relative_tolerance: 1.0e-10
    increment_absolute_tolerance: 1.0e-12
    increment_relative_tolerance: 1.0e-10
materials:
  matrix_elastic:
    density: 2400.0
    young_modulus: 1000.0
    poisson_ratio: 0.20
  matrix_viscoplastic:
    density: 2400.0
    young_modulus: 1000.0
    poisson_ratio: 0.20
    yield_stress: 10.0
    hardening_modulus: 20.0
    time_scale: 0.02
    reference_stress: 10.0
    rate_exponent: 2.0
  inclusion_elastic:
    density: 7850.0
    young_modulus: 6666.666666666667
    poisson_ratio: 0.30
path:
  time_step: 1.0e-3
  macro_strains:
    - [0.002, -0.0005, -0.0005, 0.0, 0.0, 0.005]
    - [0.010, -0.0020, -0.0020, 0.0, 0.0, 0.015]
    - [0.006, -0.0010, -0.0010, 0.0, 0.0, 0.005]
    - [0.012, -0.0020, -0.0020, 0.002, -0.001, -0.010]
verification:
  elastic_macro_strain: [0.001, -0.0002, -0.0002, 0.0001, -0.0001, 0.0002]
  stress_scale: 10.0
  tangent_perturbation: 1.0e-7
  maximum_loading_angular_frequency: 0.1
  hill_mandel_power_scale: 10.0
  tolerances:
    geometry_area: 0.03
    stress: 1.0e-8
    tangent: 1.0e-8
    bound: 1.0e-8
    hill_mandel: 1.0e-9
    state: 1.0e-12
    energy: 1.0e-12
    plastic_activity: 1.0e-12
    mesh_stress: 2.0e-2
    mesh_tangent: 2.0e-2
    nonlinear_tangent_direction: 1.0e-5
    reaction: 1.0e-10
    dynamic_ratio: 0.1
    dynamic_tangent: 1.0e-2
output:
  root: results/benchmarks/rve/cylindrical_inclusion
