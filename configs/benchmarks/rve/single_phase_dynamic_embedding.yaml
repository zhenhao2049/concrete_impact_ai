case:
  name: single_phase_rve_dynamic_embedding
  description: One independent homogeneous RVE per macro Gauss point.
model:
  name: single_phase_rve_dynamic_embedding
  dimension: 3
  geometry:
    type: box
    origin: [0.0, 0.0, 0.0]
    size: [0.02, 0.01, 0.01]
  mesh:
    generator: gmsh
    element_type: hex8
    divisions: [2, 1, 1]
  material:
    type: j2_viscoplastic
    name: embedding_j2
    density: 1.0
    young_modulus: 3339.9160679991464
    poisson_ratio: 0.36994096308414537
    yield_stress: 10.0
    hardening_modulus: 80.0
    time_scale: 0.02
    reference_stress: 10.0
    rate_exponent: 2.0
  quadrature:
    order: 2
  boundary_conditions:
    dirichlet:
      - name: fix_left
        group: left
        components: [ux, uy, uz]
        values: [0.0, 0.0, 0.0]
    velocity: []
    traction: []
    pressure: []
rve:
  lengths: [1.0, 1.0, 1.0]
  divisions: [1, 1, 1]
  hill_mandel_power_scale: 10.0
analysis:
  material_update:
    max_iterations: 50
    yield_relative_tolerance: 1.0e-10
    residual_absolute_tolerance: 1.0e-12
    residual_relative_tolerance: 1.0e-10
  explicit:
    scheme: explicit_central_difference
    time_step: 2.0e-5
    num_steps: 20
    beta: 0.0
    gamma: 0.5
    cfl_safety_factor: 0.8
  implicit:
    scheme: implicit_newmark
    time_step: 1.0e-4
    num_steps: 4
    beta: 0.25
    gamma: 0.5
    cfl_safety_factor: 0.8
    adaptive_time_step:
      enabled: false
    newton:
      max_iterations: 20
      residual_absolute_tolerance: 1.0e-9
      residual_relative_tolerance: 1.0e-8
      increment_absolute_tolerance: 1.0e-12
      increment_relative_tolerance: 1.0e-8
      armijo:
        enabled: true
        sufficient_decrease: 1.0e-4
        reduction_factor: 0.5
        max_backtracks: 20
loading:
  group: right
  amplitude: 20.0
  duration: 2.0e-4
  outward_normal: [1.0, 0.0, 0.0]
verification:
  displacement_scale: 0.01
  velocity_scale: 1.0
  stress_scale: 10.0
  energy_scale: 0.01
  strain_scale: 0.01
  rve_embedding_tolerance: 1.0e-9
output:
  root: results/benchmarks/rve/single_phase_dynamic_embedding
  mesh_path: results/benchmarks/rve/single_phase_dynamic_embedding/mesh.msh
  vtk_path: results/benchmarks/rve/single_phase_dynamic_embedding/mesh.vtu
  save_vtk: false
  save_history: true
  fields: [displacement, stress, equivalent_plastic_strain]
