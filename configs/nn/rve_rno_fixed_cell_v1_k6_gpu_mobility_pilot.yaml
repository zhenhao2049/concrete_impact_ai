schema_version: "2.0"
model:
  family: energy_rve_rno
  time_representation: continuous
  integrator: cs_semi_implicit_forward_euler
  reference_time_scale: 0.02
  evolution: mobility_gradient
  latent_dimension: 6
  hidden_size: 128
  hidden_layers: 4
  activation: silu
  dtype: float64
  device: cuda
loss:
  stress: path_normalized_mse
  thermodynamic_violation_weight: 1.0e-3
  dissipation_supervision_weight: 1.0e-2
execution:
  preload_to_memory: true
  pin_memory: true
  non_blocking_transfer: true
  num_workers: 0
  compile:
    enabled: true
    backend: inductor
    fullgraph: true
    dynamic: false
data_plan: configs/experiments/rve_rno_fixed_cell_v1.yaml
response_shard_manifest: results/rve_rno_fixed_cell_v1_production/response_shards.json
data_acceptance_report: results/rve_rno_fixed_cell_v1_production/acceptance_pilot/training_data_acceptance.json
output_directory: results/rve_rno_training/fixed_cell_v2_k6_gpu_mobility_pilot
random_seed: 71000
epochs: 500
batch_size: 16
learning_rate: 1.0e-3
checkpoint_interval: 25
