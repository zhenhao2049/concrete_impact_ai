schema_version: "4.0"
purpose: fixed_cell_rve_training
storage_mode: compact_streaming
output_directory: results/rve_rno_c48_v2_2000
mesh_selection_report: results/benchmarks/rve/rve_rno_fixed_cell_mesh/rve_mesh_selection.json
parallel:
  workers: 5
  paths_per_task: 1
  shard_path_count: 1
  compression: lzf
  thread_count_per_worker: 3
  logical_cpu_budget: 16
audit:
  q_tolerance: 1.0e-12
  plastic_q_threshold: 1.0e-8
  dissipation_tolerance: 1.0e-12
  positive_cumulative_dissipation_threshold: 1.0e-12
  work_tolerance: 1.0e-12
  stress_drop_threshold: 1.0e-10
  strain_increment_tolerance: 1.0e-14
  hold_strain_tolerance: 1.0e-14
  hold_stress_relaxation_threshold: 1.0e-10
  tangent_perturbation: 1.0e-7
  tangent_stress_scale: 10.0
  tangent_direction_tolerance: 1.0e-5
sources:
  - name: c48_fixed_cylindrical_inclusion_rve
    kind: heterogeneous_rve
    model: fixed_periodic_ogrid_j2_matrix_elastic_inclusion_c48_v2
    boundary:
      kind: periodic_macro_strain
      description: Exact periodic fluctuation constraint and perfect matrix-inclusion interface.
    load_cases:
      - name: c48_factorial_production_paths
        path_count: 2000
        time_points: 64
        duration: 0.02
        excitation: cyclic_nonproportional_strain
        seed: 71000
        peak_scale: 0.05
        path_families: [monotonic, load_unload_reload, reverse, hold, nonproportional]
        expected_response:
          regime: transition
          require_unloading: false
          require_reverse_loading: false
    production_design:
      amplitude_bands:
        - {name: A1, lower: 3.0e-4, upper: 1.0e-3, expected_response: elastic}
        - {name: A2, lower: 1.0e-3, upper: 5.0e-3, expected_response: transition}
        - {name: A3, lower: 5.0e-3, upper: 1.5e-2, expected_response: transition}
        - {name: A4, lower: 1.5e-2, upper: 3.0e-2, expected_response: viscoplastic}
        - {name: A5, lower: 3.0e-2, upper: 5.0e-2, expected_response: viscoplastic}
      rate_bands:
        - {name: R1, lower: 0.1, upper: 1.0}
        - {name: R2, lower: 1.0, upper: 5.0}
        - {name: R3, lower: 5.0, upper: 20.0}
        - {name: R4, lower: 20.0, upper: 40.0}
      tensor_directions:
        - deviatoric_uniaxial
        - deviatoric_biaxial
        - shear_dominant
        - positive_triaxial
        - negative_triaxial
      accepted_increment_counts: [64, 96, 128, 192]
      nonproportional_turning_angles: [0.75, 1.25, 1.90, 2.40]
      paths_per_stratum: 20
      train_per_stratum: 14
      validation_per_stratum: 3
      test_per_stratum: 3
      snapshots_per_stratum: 2
      tangent_checks_per_stratum: 1
      direction_perturbation: 0.08
    fields:
      inputs: [time, time_step, macro_strain]
      labels: [macro_stress, effective_tangent, dissipation_density]
      state_fields: []
      diagnostics:
        - phase_average_stress
        - phase_volume_fraction
        - hill_mandel_error
        - incremental_work_density
        - viscoplastic_active_volume_fraction
    training_role: homogenization
    macro_path_origin: prescribed_macro_strain
    material_parameters:
      matrix_young_modulus: {kind: fixed, value: 1000.0}
      matrix_poisson_ratio: {kind: fixed, value: 0.2}
      matrix_yield_stress: {kind: fixed, value: 10.0}
      matrix_hardening_modulus: {kind: fixed, value: 20.0}
      matrix_time_scale: {kind: fixed, value: 0.02}
      matrix_rate_exponent: {kind: fixed, value: 2.0}
      inclusion_young_modulus: {kind: fixed, value: 6666.666666666667}
      inclusion_poisson_ratio: {kind: fixed, value: 0.3}
    microstructure_parameters:
      inclusion_volume_fraction: {kind: fixed, value: 0.05}
      circumferential_divisions: {kind: fixed, value: 48.0}
      matrix_radial_divisions: {kind: fixed, value: 6.0}
      axial_divisions: {kind: fixed, value: 6.0}
