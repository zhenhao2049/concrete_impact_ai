schema_version: "3.0"
output_directory: results/rve_rno_data_pilot_v2
parallel:
  workers: 2
  paths_per_task: 1
  shard_path_count: 5
  compression: lzf
  thread_count_per_worker: 1
audit: &audit_thresholds
  q_tolerance: 1.0e-12
  plastic_q_threshold: 1.0e-8
  dissipation_tolerance: 1.0e-12
  positive_cumulative_dissipation_threshold: 1.0e-12
  work_tolerance: 1.0e-12
  stress_drop_threshold: 1.0e-10
  strain_increment_tolerance: 1.0e-14
  hold_strain_tolerance: 1.0e-14
  hold_stress_relaxation_threshold: 1.0e-10
  tangent_perturbation: 1.0e-7
  tangent_stress_scale: 10.0
  tangent_direction_tolerance: 1.0e-5
sources:
  - name: pilot_material_point
    kind: material_point
    model: homogeneous_j2_viscoplastic_material_point
    boundary: {kind: none, description: Prescribed six-component strain history.}
    load_cases:
      - &mp_elastic
        name: elastic_paths
        path_count: 5
        time_points: 64
        duration: 0.08
        excitation: prescribed_six_component_strain
        seed: 11100
        peak_scale: 0.001
        path_families: [monotonic, load_unload_reload, reverse, hold, nonproportional]
        expected_response: {regime: elastic, require_unloading: false, require_reverse_loading: false}
      - &mp_plastic
        name: viscoplastic_paths
        path_count: 5
        time_points: 64
        duration: 0.08
        excitation: prescribed_six_component_strain
        seed: 11200
        peak_scale: 0.05
        path_families: [monotonic, load_unload_reload, reverse, hold, nonproportional]
        expected_response: {regime: viscoplastic, require_unloading: false, require_reverse_loading: false}
    fields:
      inputs: [time, time_step, macro_strain, material_parameters]
      labels: [macro_stress, effective_tangent, dissipation_density]
      state_fields: [plastic_strain, equivalent_plastic_strain, viscoplastic_multiplier]
      diagnostics: [trial_yield_value, yield_activation_margin, local_residual, local_iterations, incremental_work_density, equivalent_stress_increment, viscoplastic_active]
    training_role: pretraining
    macro_path_origin: prescribed_macro_strain
    material_parameters: &point_material
      young_modulus: {kind: fixed, value: 3339.9160679991464}
      poisson_ratio: {kind: fixed, value: 0.36994096308414537}
      yield_stress: {kind: fixed, value: 10.0}
      hardening_modulus: {kind: fixed, value: 80.0}
      time_scale: {kind: fixed, value: 0.02}
    microstructure_parameters: {}
  - name: pilot_single_phase_rve
    kind: single_phase_rve
    model: periodic_hex8_single_phase_j2_viscoplastic_rve
    boundary: {kind: periodic_macro_strain, description: Exact periodic fluctuation constraint.}
    load_cases:
      - <<: *mp_elastic
        excitation: cyclic_nonproportional_strain
        seed: 21100
      - <<: *mp_plastic
        excitation: cyclic_nonproportional_strain
        seed: 21200
    fields:
      inputs: [time, time_step, macro_strain, material_parameters]
      labels: [macro_stress, effective_tangent, dissipation_density]
      state_fields: [plastic_strain, equivalent_plastic_strain, viscoplastic_multiplier]
      diagnostics: [hill_mandel_error, periodic_fluctuation_error, micro_residual_norm, incremental_work_density, viscoplastic_active]
    training_role: homogenization
    macro_path_origin: prescribed_macro_strain
    material_parameters: *point_material
    microstructure_parameters: {}
  - name: pilot_heterogeneous_rve
    kind: heterogeneous_rve
    model: periodic_conforming_ogrid_j2_matrix_elastic_inclusion_rve
    boundary: {kind: periodic_macro_strain, description: Exact periodic two-phase RVE boundary.}
    load_cases:
      - <<: *mp_elastic
        excitation: cyclic_nonproportional_strain
        seed: 31100
        peak_scale: 0.002
      - <<: *mp_plastic
        excitation: cyclic_nonproportional_strain
        seed: 31200
    fields: &heterogeneous_fields
      inputs: [time, time_step, macro_strain, material_parameters, microstructure_features]
      labels: [macro_stress, effective_tangent, dissipation_density]
      state_fields: [phase_matrix__plastic_strain, phase_matrix__equivalent_plastic_strain]
      diagnostics: [phase_average_stress, phase_volume_fraction, hill_mandel_error, incremental_work_density, viscoplastic_active]
    training_role: coverage
    macro_path_origin: prescribed_macro_strain
    material_parameters: &heterogeneous_material
      matrix_young_modulus: {kind: fixed, value: 1000.0}
      matrix_yield_stress: {kind: fixed, value: 10.0}
      matrix_time_scale: {kind: fixed, value: 0.02}
      inclusion_young_modulus: {kind: fixed, value: 6666.666666666667}
    microstructure_parameters: &pilot_microstructure
      inclusion_volume_fraction: {kind: fixed, value: 0.05}
      circumferential_divisions: {kind: fixed, value: 16.0}
  - name: pilot_impact_paths
    kind: impact_path
    model: macro_hex8_bar_with_periodic_heterogeneous_rve_replay
    boundary: {kind: macro_impact_structure, description: Fixed left face and half-sine right pressure.}
    load_cases:
      - name: elastic_impact
        path_count: 5
        time_points: 81
        duration: 0.08
        excitation: half_sine_pressure_pulse
        seed: 41100
        peak_scale: 5.0
        pulse_duration_fraction: 0.25
        axial_region_count: 5
        path_families: [monotonic]
        expected_response: {regime: elastic, require_unloading: true, require_reverse_loading: false}
      - name: viscoplastic_impact
        path_count: 5
        time_points: 81
        duration: 0.08
        excitation: half_sine_pressure_pulse
        seed: 41200
        peak_scale: 40.0
        pulse_duration_fraction: 0.25
        axial_region_count: 5
        path_families: [monotonic]
        expected_response: {regime: viscoplastic, require_unloading: true, require_reverse_loading: false}
    fields: *heterogeneous_fields
    training_role: validation
    macro_path_origin: direct_j2_explicit
    material_parameters: *heterogeneous_material
    microstructure_parameters: *pilot_microstructure
